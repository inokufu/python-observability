site_name: "Observability"
theme: material

nav:
  - Home: README.md
  - Reference: reference.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_submodules: true
            docstring_style: google
            members_order: source
            show_source: false
            extensions:
              - griffe_inherited_docstrings
